<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>現場叫號看板</title>
  <link rel="stylesheet" href="style.css?v=3.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="customer-mobile-page">
  <div class="mobile-app-container">
    <!-- 頂部手機資訊列 -->
    <header class="mobile-header">
      <div class="brand">
        <span class="icon">📢</span>
        <div>
          <div class="brand-title-wrap">
            <h1>現場叫號看板</h1>
          </div>
        </div>
      </div>
    </header>

    <main class="mobile-main">
      <!-- 現場叫號看板 -->
      <section class="card display-card mobile-display-card">
        <div class="card-header">
          <h2>目前叫號</h2>
          <span id="activeCounterBadge" class="counter-pill" style="display: none;">1 號櫃檯</span>
        </div>

        <div class="display-board">
          <div class="calling-number-wrap">
            <span id="currentNumberDisplay" class="calling-number">---</span>
          </div>
          <div class="display-subtext" id="displaySubtext">目前暫無叫號中顧客</div>
        </div>

        <div class="queue-stats-row">
          <div class="stat-pill">
            <span class="stat-p-label">現場等候</span>
            <span class="stat-p-val" id="waitingCountDisplay">0</span>
            <span class="stat-p-unit">人</span>
          </div>
          <div class="stat-p-divider"></div>
          <div class="stat-pill">
            <span class="stat-p-label">現在時間</span>
            <span class="stat-p-val font-mono" id="liveClock">00:00:00</span>
          </div>
        </div>
      </section>

      <!-- 📢 可直接到櫃檯領取（已叫號但尚未更改為好了的號碼） -->
      <section class="card pickup-ready-card">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.25rem;">🛎️</span>
            <div>
              <h3 style="font-size: 1.05rem; font-weight: 700; color: #34d399; margin: 0;">可至櫃檯領取（已叫號）</h3>
              <p style="font-size: 0.75rem; color: #94a3b8; margin: 2px 0 0 0;">下列號碼已叫號，可直接前往櫃檯領取</p>
            </div>
          </div>
          <span id="pickupCountBadge" style="font-size: 0.8rem; font-weight: 700; color: #34d399; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(52, 211, 153, 0.3); padding: 3px 10px; border-radius: 20px;">
            0 個
          </span>
        </div>

        <div id="pickupNumbersGrid" class="pickup-numbers-grid">
          <div class="pickup-empty-hint">目前無待領取的已叫號號碼</div>
        </div>
      </section>

      <!-- 顧客輸入自己的號碼牌查詢進度 -->
      <section class="card my-check-card" style="margin-top: 14px; padding: 18px; border-radius: 16px; background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(10px); border: 1.5px solid rgba(255, 255, 255, 0.1);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.25rem;">🎫</span>
            <h3 style="font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin: 0;">查詢我的號碼牌進度</h3>
          </div>
        </div>

        <!-- 是否需要到號震動提醒 (下拉選單只有是跟否) -->
        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.55); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 12px;">
          <label for="needVibrateSelect" style="font-size: 0.88rem; color: #cbd5e1; font-weight: 600; display: flex; align-items: center; gap: 6px;">
            <span>📳</span>
            <span>是否需要到號震動提醒：</span>
          </label>
          <select id="needVibrateSelect" style="padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: #1e293b; color: #f8fafc; font-size: 0.88rem; outline: none; cursor: pointer;">
            <option value="yes" selected>是</option>
            <option value="no">否</option>
          </select>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="number" id="myNumberInput" placeholder="請輸入您的號碼（例：10）" min="1" max="999"
            style="flex: 1; padding: 12px 14px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.18); background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 1.1rem; font-family: 'Share Tech Mono', monospace; outline: none; box-sizing: border-box;">
          <button id="checkMyNumberBtn" class="pill-btn highlight-link" style="padding: 0 20px; font-weight: 700; font-size: 0.95rem; white-space: nowrap; border-radius: 10px; background: #2563eb; color: #fff; border: none; cursor: pointer;">
            查詢
          </button>
          <button id="clearMyNumberBtn" class="pill-btn hidden" style="padding: 0 12px; font-size: 0.85rem; white-space: nowrap; border-radius: 10px; background: rgba(255,255,255,0.1); color: #94a3b8; border: none; cursor: pointer;">
            清除
          </button>
        </div>

        <!-- 計算結果即時顯示區 -->
        <div id="myResultBox" class="hidden" style="border-radius: 12px; padding: 14px 16px; text-align: center; transition: all 0.25s ease;">
          <div id="myResultMainText" style="font-size: 1.2rem; font-weight: 900; margin-bottom: 4px; letter-spacing: 0.5px;"></div>
          <div id="myResultSubText" style="font-size: 0.85rem; opacity: 0.9;"></div>
          <div id="myResultVibrateHint" style="font-size: 0.82rem; color: #93c5fd; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.15);"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js?v=3.3"></script>
  <script src="shared.js?v=3.3"></script>
  <script src="customer.js?v=3.3"></script>
</body>
</html>
