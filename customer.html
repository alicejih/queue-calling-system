<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>現場叫號看板</title>
  <link rel="stylesheet" href="style.css?v=2.5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="customer-mobile-page">
  <div class="mobile-app-container">
    <!-- 頂部手機資訊列 -->
    <header class="mobile-header">
      <div class="brand">
        <span class="icon">📢</span>
        <div>
          <div class="brand-title-wrap">
            <h1>現場叫號看板</h1>
            <span class="cloud-sync-badge local" id="cloudSyncBadge"><span class="dot"></span> 連線中</span>
          </div>
        </div>
      </div>
      <div class="header-controls">
        <button id="voiceToggleBtn" class="pill-btn mini-btn active" title="切換手機語音廣播">
          <span class="icon">🔊</span> <span id="voiceStatusText">語音</span>
        </button>
        <button id="soundToggleBtn" class="pill-btn mini-btn active" title="切換手機提示音">
          <span class="icon">🎵</span> <span id="soundStatusText">音效</span>
        </button>
      </div>
    </header>

    <main class="mobile-main">
      <!-- 現場叫號看板 (Now Serving) -->
      <section class="card display-card mobile-display-card">
        <div class="card-header">
          <span class="badge pulse">NOW SERVING</span>
          <h2>目前叫號</h2>
          <span id="activeCounterBadge" class="counter-pill">1 號櫃檯</span>
        </div>

        <div class="display-board">
          <div class="label-current">CURRENT CALLING</div>
          <div class="calling-number-wrap">
            <span id="currentNumberDisplay" class="calling-number">---</span>
          </div>
          <div class="display-subtext" id="displaySubtext">目前暫無叫號中顧客</div>
        </div>

        <div class="queue-stats-row">
          <div class="stat-pill">
            <span class="stat-p-label">現場等候</span>
            <span class="stat-p-val" id="waitingCountDisplay">0</span>
            <span class="stat-p-unit">人</span>
          </div>
          <div class="stat-p-divider"></div>
          <div class="stat-pill">
            <span class="stat-p-label">今日已發</span>
            <span class="stat-p-val" id="totalIssuedDisplay">0</span>
            <span class="stat-p-unit">號</span>
          </div>
          <div class="stat-p-divider"></div>
          <div class="stat-pill">
            <span class="stat-p-label">現在時間</span>
            <span class="stat-p-val font-mono" id="liveClock">00:00:00</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js?v=2.5"></script>
  <script src="shared.js?v=2.5"></script>
  <script src="customer.js?v=2.5"></script>
</body>
</html>
